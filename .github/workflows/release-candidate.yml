name: Signed release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release-candidate
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-candidate
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Install locked validation environment
        run: |
          python -m pip install uv==0.11.19
          uv sync --frozen --all-extras
      - name: Validate candidate
        run: |
          uv run --frozen ruff check src tests
          uv run --frozen mypy
          uv run --frozen pytest -q --junitxml=release-junit.xml
      - name: Build and inspect candidate
        run: |
          uv build
          uv run --frozen python -m pip_audit . --strict --progress-spinner off
          uv run --frozen python -m pip_audit . --format cyclonedx-json --output dist/dependencies.cdx.json --progress-spinner off
      - name: Generate hosted build provenance for distributions and SBOM
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Verify candidate provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
      - name: Retain verified candidate (no package-registry publication)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-release-candidate
          path: |
            dist/*
            release-junit.xml
            ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
