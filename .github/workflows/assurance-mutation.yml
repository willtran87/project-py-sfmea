name: Assurance enforcement mutations
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/pysfmea/measurement_validity.py
      - src/pysfmea/scope_authentication.py
      - src/pysfmea/upstream_contract.py
      - tests/test_measurement_enforcement.py
      - scripts/run_mutations.py
      - quality/assurance-mutation-policy.json
      - .github/workflows/assurance-mutation.yml
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: |
          python -m pip install uv==0.11.19
          uv sync --frozen --all-extras
      - name: Exercise assurance-decision mutations
        run: |
          set +e
          timeout --signal=TERM 30m uv run --frozen python scripts/run_mutations.py run "pysfmea.measurement_validity.*" "pysfmea.scope_authentication.*" "pysfmea.upstream_contract.*"
          printf '%s\n' "$?" > assurance-mutation-exit.txt
          exit 0
      - name: Require per-module mutation adequacy
        run: >-
          uv run --frozen python scripts/check_mutation_ratchet.py mutants
          --policy quality/assurance-mutation-policy.json
          --runner-exit-code-file assurance-mutation-exit.txt
          --output assurance-mutation-quality.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: assurance-mutation-quality
          path: |
            mutants/**/*.meta
            assurance-mutation-exit.txt
            assurance-mutation-quality.json
          if-no-files-found: error
