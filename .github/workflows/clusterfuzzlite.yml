name: ClusterFuzzLite

on:
  pull_request:
    paths:
      - "src/**"
      - "fuzz_targets/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/clusterfuzzlite.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: clusterfuzzlite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ${{ github.event_name == 'pull_request' && 'Code-change fuzzing' || 'Batch fuzzing' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact repository revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Build Python fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
          storage-repo: ${{ secrets.CFL_STORAGE_REPO }}
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages

      - name: Run Python fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@82652fb49e77bc29c35da1167bb286e93c6bcc05 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && '600' || '1800' }}
          sanitizer: address
          output-sarif: true
          minimize-crashes: true
          parallel-fuzzing: true
          storage-repo: ${{ secrets.CFL_STORAGE_REPO }}
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages
