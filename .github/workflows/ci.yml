name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development environment
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,signing]"

      - name: Compile package
        run: python -m compileall -q src

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m pytest -q

      - name: Validate published JSON Schemas
        shell: python
        run: |
          from jsonschema import Draft202012Validator
          from pysfmea.schemas import schema_catalog, schema_document

          for entry in schema_catalog()["schemas"]:
              Draft202012Validator.check_schema(schema_document(entry["name"]))

      - name: Smoke-test CLI
        run: sfmea --version && sfmea schema --list

  package:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Build source and wheel distributions
        run: python -m pip install --upgrade pip build && python -m build

      - name: Install and smoke-test wheel
        run: |
          python -m venv .package-smoke
          .package-smoke/bin/python -m pip install dist/*.whl
          .package-smoke/bin/sfmea --version
          .package-smoke/bin/sfmea schema --list

      - name: Publish workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pysfmea-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Coverage, typing, and security gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install quality environment
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,signing,quality]"

      - name: Enforce branch coverage
        run: python -m coverage run --branch -m pytest -q && python -m coverage report && python -m coverage xml && python -m coverage json

      - name: Enforce critical-module coverage ratchets
        run: python scripts/check_coverage_ratchets.py coverage.json

      - name: Enforce typed subsystem boundaries
        run: python -m mypy

      - name: Scan source for security defects
        run: python -m bandit -q -r src/pysfmea -c pyproject.toml -ll

      - name: Audit installed dependencies
        run: python -m pip_audit . --strict --progress-spinner off

      - name: Generate dependency SBOM
        run: python -m pip_audit . --format cyclonedx-json --output pysfmea-build.cdx.json --progress-spinner off

      - name: Publish coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pysfmea-coverage
          path: |
            coverage.xml
            coverage.json
            pysfmea-build.cdx.json
          if-no-files-found: error
          retention-days: 14

  mutation:
    name: Focused fault-plugin mutation gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install mutation environment
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,signing,quality]"

      - name: Reject surviving critical policy mutations
        run: >-
          mutmut run
          "pysfmea.fault_injection.assert_fault_injection_result*"
          "pysfmea.fault_injection._expected_outcomes*"
          "pysfmea.fault_injection.verify_fault_injection_plan*"
          "pysfmea.runtime._span_timing*"
          "pysfmea.runtime._component_from_span*"
          "pysfmea.sandbox_policy.sandbox_command*"
