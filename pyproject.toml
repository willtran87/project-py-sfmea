[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pysfmea"
dynamic = ["version"]
description = "A local, guidance-based Software FMEA starter for Python repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PySFMEA contributors" }]
keywords = ["dfmea", "fmea", "python", "safety", "sfmea", "software-assurance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
signing = ["cryptography>=42"]
dev = [
  "build>=1.2",
  "jsonschema>=4.23",
  "pytest>=8",
  "ruff>=0.9",
]

[project.urls]
Documentation = "https://github.com/willtran87/project-py-sfmea/tree/main/docs"
Issues = "https://github.com/willtran87/project-py-sfmea/issues"
Repository = "https://github.com/willtran87/project-py-sfmea"

[project.scripts]
sfmea = "pysfmea.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "pysfmea.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "I"]
